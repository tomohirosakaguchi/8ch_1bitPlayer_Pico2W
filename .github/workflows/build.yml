name: Build Pico 2 W

on:
  push:
    branches: [ main, envdev, develop ]
  pull_request:
    branches: [ main, envdev, develop ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          libstdc++-arm-none-eabi-newlib \
          git \
          python3
    
    - name: Clone Pico SDK
      env:
        PICO_SDK_PATH: ${{ github.workspace }}/../pico-sdk
      run: |
        git clone -b 2.0.0 https://github.com/raspberrypi/pico-sdk.git $PICO_SDK_PATH
        cd $PICO_SDK_PATH
        git submodule update --init
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure with CMake
      env:
        PICO_SDK_PATH: ${{ github.workspace }}/../pico-sdk
      run: |
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DPICO_BOARD=pico2 \
              -DPICO_PLATFORM=rp2350 \
              -DPICO_SDK_PATH=$PICO_SDK_PATH \
              ..
    
    - name: Build project
      run: |
        cd build
        make -j$(nproc)
    
    - name: Find and upload uf2 files
      if: success()
      run: |
        find build -name "*.uf2" -type f -exec ls -lh {} \;
    
    - name: Upload uf2 as artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pico2w-firmware
        path: build/*.uf2
        retention-days: 30
    
    - name: Create Release on success
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.uf2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
